name: Update sports data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-data-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch scores and standings
        run: python3 scripts/update_sports.py
      - name: Save snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/sports-data.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh sports scores and standings"
          git pull --rebase origin main
          git push origin HEAD:main
